<!-- Gift Card Vault icon (1.3.0): "Ribbon Cross" on "Ocean", chosen by the
     user 03-Oct-2026 from the options page (six designs x three grounds).
     Card Vault's Keyhole drawing language - white card, orange stripe in the
     SAME place, keyhole - crossed with a ribbon and bow, so the two read as a
     family. Two-colour ground #3f97ff -> #3a2fc9, corner to corner (the same
     vector Card Vault 1.3.3 chose); keyhole and bar in the dark stop. One
     72-unit drawing, reused by icon-foreground.svg, web/favicon.svg, the
     header mark, the lock badge and tools/make-splash.js. No network marks. -->
