# Temporary: what do Tanishq and Bhima serve to a GitHub runner?
# Manual trigger only. Delete once the answer is known.
name: KB debug

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          for pair in "tanishq|https://www.tanishq.co.in/gold-rate.html?lang=en_IN" "bhima|https://www.bhimagold.com/"; do
            name="${pair%%|*}"; url="${pair#*|}"
            echo "==================== $name"
            curl -sL --compressed -A "$UA" -H 'Accept-Language: en-IN,en;q=0.9' \
                 -o /tmp/$name.html -w "status=%{http_code} size=%{size_download} ip=%{remote_ip}\n" "$url"
            echo "-- title:";      grep -o -i -m1 '<title>[^<]*' /tmp/$name.html | head -c 200; echo
            echo "-- rupee count:  $(grep -o '₹' /tmp/$name.html | wc -l)"
            echo "-- dollar count: $(grep -o 'USD\|\$' /tmp/$name.html | wc -l)"
            echo "-- '22 Kt'/'22 KT' hits: $(grep -o -i '22 *k[tT]' /tmp/$name.html | wc -l)"
            echo "-- challenge markers: $(grep -o -i 'captcha\|are you a human\|access denied\|akamai\|cloudflare\|incapsula' /tmp/$name.html | sort -u | tr '\n' ' ')"
            echo "-- currency hints:"
            grep -o -i -E '.{60}(currency|country|locale|region)[^<]{0,60}' /tmp/$name.html | head -5
            echo "-- first rate-ish numbers:"
            grep -o -E '(₹|Rs\.?) ?[0-9][0-9,]{3,}' /tmp/$name.html | head -5
          done
