# Karat Board - the scheduled build that makes this app a website.
#
# Every 15 minutes GitHub runs the sweep, drops rates.json next to the page and
# publishes the lot to Pages. Visitors get static files off a CDN; the Python
# never runs on anyone's request, so there is no server and no bill.
#
# Put this at .github/workflows/karat-board.yml in the repo that serves the site.
# It expects tools/karat-board/ to hold app.py, merchants.json and build_site.py,
# and it publishes the whole repo (your existing pages plus gold/).
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

name: Karat Board rates

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort - expect 15-30 in
    # practice, longer when the hosted runners are busy. Fine for gold rates.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # lets you force a build from the Actions tab
  push:
    branches: [main]        # rebuild whenever the site or the recipes change

# Never let two sweeps publish over each other; a queued one can simply drop.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only MMTC-PAMP's price-list PDF needs a third-party library.
      - run: pip install --quiet pypdf

      - name: Sweep the merchants and build the page
        env:
          KB_EVERY: "15"            # what the page tells visitors
          KB_STATE: ${{ runner.temp }}/board.json
          # A runner is blank every time. Two of these merchants sit behind
          # Cloudflare and refuse datacenter IPs, so carry the last published
          # numbers in and let them go stale visibly rather than vanish.
          KB_SEED_URL: https://yourcardjourney.store/gold/rates.json
        run: python tools/karat-board/build_site.py gold

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                   # the whole site: your pages plus gold/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
